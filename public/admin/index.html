<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>资料管理后台 · 具身智人</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/admin-auth.css">
  <style>[data-language-field][hidden]{display:none!important}.language-notice{padding:10px 12px;border:1px solid #cfe0ff;border-radius:9px;background:#f3f7ff;color:#315584;font-size:13px}</style>
</head>
<body>
  <header class="topbar">
    <div><strong>资料管理后台</strong><span>具身智人技术支持中心</span></div>
    <div class="account"><span id="admin-account"></span><a href="/" target="_blank" rel="noopener">查看门户网站</a><button id="logout-button" type="button">退出登录</button></div>
  </header>
  <main>
    <section class="panel filters">
      <div class="section-heading"><div><h1>资料列表</h1><p>管理D1资料记录及其关联的R2文件</p></div><button class="primary" id="create-button">新增资料</button></div>
      <form id="filter-form" class="filter-grid">
        <label>产品<select name="product"><option value="">全部产品</option><option value="yingao">影獒</option><option value="tieao">铁獒</option></select></label>
        <label>父目录<select name="parent"><option value="">全部父目录</option></select></label>
        <label>末级栏目<select name="category"><option value="">全部末级栏目</option></select></label>
        <label>状态<select name="status"><option value="">全部状态</option><option value="draft">草稿</option><option value="published">已发布</option><option value="unpublished">已下架</option></select></label>
        <label>语言<select name="language"><option value="">全部语言</option><option value="zh-CN">中文资料</option><option value="en">英文资料</option></select></label>
        <label class="keyword">关键词<input name="keyword" maxlength="100" placeholder="标题或摘要"></label>
        <button type="submit">筛选</button>
      </form>
      <div class="table-wrap">
        <table><thead><tr><th>标题</th><th>产品 / 栏目</th><th>类型</th><th>版本</th><th>文件</th><th>状态</th><th>发布时间</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="resource-rows"></tbody></table>
        <div class="empty" id="list-state">正在加载资料…</div>
      </div>
    </section>
  </main>

  <dialog id="editor-dialog">
    <form id="resource-form" method="dialog">
      <div class="dialog-head"><div><h2 id="editor-title">新增资料</h2><p>只有末级栏目可以保存资料</p></div><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div>
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>产品<span>*</span><select name="product_key" required><option value="">请选择</option><option value="yingao">影獒</option><option value="tieao">铁獒</option></select></label>
        <label>父目录<span>*</span><select name="parent_key" required><option value="">请选择</option></select></label>
        <label class="wide">末级栏目<span>*</span><select name="category_key" required><option value="">请选择</option></select></label>
        <label>资料类型<span>*</span><select name="resource_type" required><option value="document">文档</option><option value="sdk">SDK</option><option value="firmware">固件</option><option value="video">视频</option><option value="faq">常见问题</option><option value="tool">工具</option><option value="link">外部链接</option></select></label>
        <label>资料语言<span>*</span><select name="language" required><option value="">请先选择资料语言</option><option value="zh-CN">中文资料（仅中文站）</option><option value="en">英文资料（仅英文站）</option></select></label>
        <div class="wide language-notice" id="language-notice">请先选择资料语言，再填写对应语言的标题和摘要。</div>
        <label class="wide" data-language-field="zh-CN" hidden>中文标题<span>*</span><input name="title_zh" maxlength="300" disabled></label>
        <label class="wide" data-language-field="en" hidden>英文标题<span>*</span><input name="title_en" maxlength="300" disabled></label>
        <label class="wide" data-language-field="zh-CN" hidden>中文摘要<textarea name="summary_zh" maxlength="4000" rows="3" disabled></textarea></label>
        <label class="wide" data-language-field="en" hidden>英文摘要<textarea name="summary_en" maxlength="4000" rows="3" disabled></textarea></label>
        <label>版本号<input name="version" maxlength="100" placeholder="例如 V1.2.0"></label>
        <label>排序值<input name="sort_order" type="number" min="-1000000" max="1000000" value="0"></label>
        <label class="wide">外部链接<input name="external_url" type="url" maxlength="2048" placeholder="https://..."></label>
        <label class="wide">文件<input name="file" type="file" accept=".pdf,.zip,.7z,.rar,.tar,.gz,.tgz,.bin,.fw,.img,.hex,.deb,.rpm,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov"><small id="file-help">单个文件不超过100MB；文件和外部链接至少填写一个。</small></label>
      </div>
      <div class="form-error" id="form-error" hidden></div>
      <div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" data-status="draft">保存草稿</button><button type="submit" class="primary" data-status="published">保存并发布</button></div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="confirm-dialog"><form method="dialog"><h2>确认删除资料？</h2><p>删除后将先移除数据库记录，再删除对应R2文件。此操作不可撤销。</p><div class="dialog-actions"><button value="cancel">取消</button><button value="confirm" class="danger">确认删除</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/data/categories.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
