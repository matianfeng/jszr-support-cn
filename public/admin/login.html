<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理员登录 · 具身智人</title><link rel="stylesheet" href="/admin/login.css"><link rel="stylesheet" href="/admin/login-layout.css"></head>
<body><main class="login-shell"><section class="login-card" aria-labelledby="login-title"><div class="brand-mark" aria-hidden="true">AI</div><p class="eyebrow">具身智人技术支持中心</p><h1 id="login-title">资料管理后台</h1><p class="intro">请使用管理员账号登录</p><form id="login-form" autocomplete="on"><label>管理员账号<input name="username" type="text" maxlength="128" autocomplete="username" required autofocus></label><label>密码<span class="password-field"><input name="password" type="password" maxlength="1024" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="显示密码">显示</button></span></label><div id="login-error" class="error" role="alert" hidden></div><button class="login-button" type="submit">登录</button></form><a class="back-link" href="/">返回技术支持门户</a></section></main><script src="/admin/login.js"></script></body></html>
