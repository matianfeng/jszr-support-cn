<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="具身智人技术支持中心，为开发者提供产品文档、SDK、固件、教程与常见问题。">
  <title>具身智人 · 技术支持中心</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="返回技术支持中心首页">
      <strong>具身智人</strong>
      <span>技术支持中心</span>
    </a>
    <div class="header-actions"><a class="language-switch" href="en.html" aria-label="Switch to English"><span>EN</span><strong>English</strong></a><a class="support-button" href="mailto:support@example.com" aria-label="通过邮件联系支持"><svg aria-hidden="true"><use href="#icon-headset"></use></svg>联系支持</a></div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">一站式开发者支持平台</p>
        <h1>需要什么技术资料？</h1>
        <p class="hero-subtitle">快速查找产品文档、SDK、固件、教学视频和常见问题</p>
        <form class="search-box" id="search-form" role="search">
          <svg aria-hidden="true"><use href="#icon-search"></use></svg>
          <input id="search-input" type="search" placeholder="输入产品型号、资料名称或问题关键词" aria-label="搜索技术资料" autocomplete="off">
          <button type="submit">搜索资料</button>
        </form>
        <div class="search-message" id="search-message" aria-live="polite"></div>
      </div>
    </section>

    <section class="resource-section product-resources yingao-theme" id="product-resources" aria-labelledby="resource-title">
      <div class="section-heading">
        <p class="section-kicker">EXPLORE RESOURCES</p>
        <h2 id="resource-title"><span id="selected-product-name">影獒</span>技术资源</h2>
        <p>选择产品，快速进入对应技术资料</p>
      </div>
      <div class="product-resource-layout">
        <aside class="product-switcher" aria-label="选择产品">
          <div class="switcher-rail" aria-hidden="true"><span id="switcher-indicator"></span></div>
          <button class="product-option active" type="button" data-product="yingao" aria-pressed="true"><span class="product-index">01</span><span class="product-name">影獒</span><span class="product-en">SHADOW HOUND</span></button>
          <button class="product-option" type="button" data-product="tieao" aria-pressed="false"><span class="product-index">02</span><span class="product-name">铁獒</span><span class="product-en">IRON HOUND</span></button>
        </aside>
        <div class="product-stage">
          <div class="product-visual" aria-hidden="true">
            <span class="visual-orbit"></span>
            <div class="product-tagline"><strong id="product-tagline">全球首款15公斤级小型机器狗</strong></div>
            <img id="product-image" src="assets/yingao.png" alt="影獒产品图">
            <span class="visual-model" id="visual-model">YINGAO / 01</span>
          </div>
          <div class="resource-grid" id="resource-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 具身智人技术支持中心</footer>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M5 14H3v5h4v-5H5Zm14 0h2v5h-4v-5h2Zm0 5c0 2-2 3-5 3"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></symbol>
  </svg>
  <script src="app.js"></script>
</body>
</html>
