<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技术资源 · 具身智人</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><strong>具身智人</strong><span>技术支持中心</span></a>
    <div class="header-actions"><a class="language-switch" id="language-link" href="category-en.html" aria-label="Switch to English"><span>EN</span><strong>English</strong></a><a class="support-button" href="mailto:support@example.com"><svg aria-hidden="true"><use href="#icon-headset"></use></svg>联系支持</a></div>
  </header>

  <main class="category-page">
    <section class="category-hero">
      <div class="breadcrumb"><a href="index.html">首页</a><span>/</span><span id="breadcrumb-name">技术资源</span></div>
      <div class="category-title-row">
        <div class="category-icon" id="category-icon"></div>
        <div><p class="section-kicker">RESOURCE CENTER</p><h1 id="category-title">技术资源</h1><p id="category-description">查找您需要的技术资料</p></div>
      </div>
      <form class="search-box compact" id="category-search" role="search">
        <svg aria-hidden="true"><use href="#icon-search"></use></svg>
        <input id="category-search-input" type="search" placeholder="搜索当前分类" aria-label="搜索当前分类">
        <button type="submit">搜索</button>
      </form>
    </section>

    <section class="content-section document-layout">
      <aside class="document-sidebar" aria-label="文档目录">
        <div class="sidebar-heading"><span>文档目录</span><button id="expand-all" type="button">全部展开</button></div>
        <nav class="document-tree" id="document-tree"></nav>
      </aside>
      <div class="document-main">
        <div class="content-toolbar"><div><h2 id="content-title">全部内容</h2><p id="result-count"></p></div><select id="sort-select" aria-label="排序方式"><option value="recommended">推荐排序</option><option value="newest">最近更新</option><option value="title">标题排序</option></select></div>
        <div class="article-list" id="article-list"></div>
        <div class="empty-state" id="empty-state" hidden><strong>没有找到相关内容</strong><p>换一个关键词试试，或联系技术支持。</p></div>
      </div>
    </section>
  </main>
  <div class="preview-modal" id="preview-modal" hidden>
    <div class="modal-backdrop" data-close-preview></div>
    <section class="preview-panel" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header class="preview-header"><div><span class="preview-label">文档预览</span><h2 id="preview-title"></h2></div><button class="modal-close" type="button" data-close-preview aria-label="关闭预览">×</button></header>
      <div class="preview-body" id="preview-body"></div>
      <footer class="preview-footer"><span id="preview-version"></span><button class="download-button" id="preview-download" type="button">下载文档</button></footer>
    </section>
  </div>
  <footer>© 2026 具身智人技术支持中心</footer>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M5 14H3v5h4v-5H5Zm14 0h2v5h-4v-5h2Zm0 5c0 2-2 3-5 3"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></symbol>
  </svg>
  <script src="data/categories.js"></script>
  <script src="data/demo-content.js"></script>
  <script src="category-page.js"></script>
</body>
</html>
